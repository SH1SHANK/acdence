<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta
      name="description"
      content="Acdense is the canonical academic command center and term tracker for IIT Madras BS in Data Science & Applications."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Source+Code+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Acdense · September 2026</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100dvh;
          background-color: #121212;
          color: #ededed;
          font-family:
            &quot;Inter&quot;,
            -apple-system,
            sans-serif;
        "
      >
        <header
          style="
            height: 56px;
            border-bottom: 1px solid #282828;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <svg
              width="28"
              height="28"
              viewBox="0 0 48 48"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="48" height="48" rx="11" fill="#121B1B" />
              <rect
                x="0.75"
                y="0.75"
                width="46.5"
                height="46.5"
                rx="10.25"
                stroke="#70C08E"
                stroke-opacity="0.3"
                stroke-width="1.5"
              />
              <path
                d="M14.25 6 H39 L31.875 18.75 H42.75 L28.125 42 H24.375 V32.25 H10.875 L18 19.5 H5.25 L14.25 6 Z"
                fill="#70C08E"
              />
            </svg>
            <span style="font-weight: 700; font-size: 15px; letter-spacing: -0.02em">Acdense</span>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
